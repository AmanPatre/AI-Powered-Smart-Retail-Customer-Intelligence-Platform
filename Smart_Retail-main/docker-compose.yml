version: '3.8'

services:
  fastapi_api:
    build: .
    container_name: smart_retail_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - API_KEY=smart_retail_secret_key_2026
      - DATABASE_URL=sqlite:////app/data/smart_retail.db
      - DEBUG=True
    volumes:
      - ./data:/app/data
      - ./models_saved:/app/models_saved
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  streamlit_dashboard:
    build: .
    container_name: smart_retail_dashboard
    restart: always
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://fastapi_api:8000
      - API_KEY=smart_retail_secret_key_2026
    depends_on:
      fastapi_api:
        condition: service_healthy
